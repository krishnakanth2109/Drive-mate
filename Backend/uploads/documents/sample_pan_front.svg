<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
  <defs>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBE3F5"/>
      <stop offset="50%" stop-color="#E7F3FC"/>
      <stop offset="100%" stop-color="#D0E8F8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#panGrad)" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Header Banner -->
  <rect x="0" y="0" width="600" height="50" rx="16 16 0 0" fill="#1E3A8A"/>
  <text x="50" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">आयकर विभाग</text>
  <text x="550" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="end">INCOME TAX DEPARTMENT</text>
  
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A8A" text-anchor="middle">भारत सरकार / GOVT. OF INDIA</text>
  
  <!-- Photo & Hologram -->
  <rect x="40" y="105" width="125" height="155" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="102" cy="155" r="30" fill="#94A3B8"/>
  <path d="M60 240 C60 200, 144 200, 144 240 Z" fill="#94A3B8"/>
  
  <!-- Hologram square -->
  <rect x="40" y="275" width="60" height="50" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <circle cx="70" cy="300" r="16" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="70" y="304" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#D97706" text-anchor="middle">ITD</text>
  
  <!-- QR Code Mock -->
  <rect x="445" y="105" width="115" height="115" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  <rect x="458" y="118" width="25" height="25" fill="#0F172A"/>
  <rect x="522" y="118" width="25" height="25" fill="#0F172A"/>
  <rect x="458" y="182" width="25" height="25" fill="#0F172A"/>
  <rect x="492" y="152" width="20" height="20" fill="#0F172A"/>
  
  <!-- Details -->
  <text x="185" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B">Permanent Account Number (PAN) / स्थायी लेखा संख्या</text>
  <rect x="185" y="135" width="245" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="307" y="160" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#0F172A" letter-spacing="3" text-anchor="middle">BUKPT9821N</text>
  
  <text x="185" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B">Name / नाम</text>
  <text x="185" y="215" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">KRISHNA / RAJESH SHARMA</text>
  
  <text x="185" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B">Father's Name / पिता का नाम</text>
  <text x="185" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">RAMULU TELU</text>
  
  <text x="185" y="295" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B">Date of Birth / जन्म की तारीख</text>
  <text x="185" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">05/09/2001</text>
  
  <!-- Signature band -->
  <rect x="360" y="280" width="190" height="45" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <path d="M380 310 Q420 290 450 310 T520 300" fill="none" stroke="#1E3A8A" stroke-width="2"/>
  <text x="455" y="340" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Signature / हस्ताक्षर</text>
</svg>